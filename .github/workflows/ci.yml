# Standing regression gate for the single-player core: the backend suite
# (ruff + pytest on SQLite), the frontend build, and the Playwright E2E
# harness. Mark the `test` job a required status check on main.
#
# The tenancy-era steps (sandbox/lib member suites, the sandbox dependency
# denylist, the Postgres RLS isolation suites) left with the multi-tenant
# split — the hosted product's gates live with penny-web / the
# legacy/saas-monolith freeze.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Backend tests (SQLite)
        working-directory: backend
        run: uv run pytest -q

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Boots the real backend (throwaway SQLite) + vite and drives headless
      # chromium. The chat-smoke spec self-skips unless PENNY_E2E_MODEL (+ a
      # model key) is provided.
      - name: Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
