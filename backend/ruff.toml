line-length = 88
target-version = "py313"

# transient/ holds non-canonical one-off tooling (e.g. the phase-3 account
# cutover). It is deletable, is not imported by app code, and is deliberately
# exempt from the lint/format gate — see the repo AGENTS.md.
extend-exclude = ["transient"]

[lint]
extend-select = [
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "S",      # flake8-bandit
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "E203",   # whitespace before ':', conflicts with formatter
    "E266",   # too many leading '#'
    "B905",   # zip() without strict=, noisy
    "E501",   # line length — ported code predates this gate; formatter governs
]

[lint.per-file-ignores]
# S101: assert, S105/S106: test tokens/passwords, B008: FastAPI Depends()
"tests/**" = ["S101", "S105", "S106", "B008"]
# B008: typer.Option() in defaults is the idiomatic Typer parameter pattern.
"penny/cli.py" = ["B008"]
# B008: FastAPI Depends()/Query() in defaults is the idiomatic parameter pattern.
"penny/api/main.py" = ["B008"]

[lint.isort]
known-first-party = ["penny"]
combine-as-imports = true
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
